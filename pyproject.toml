[project]
name = "lab-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.142.4",
    "langchain-aws>=1.8.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.7",
    "langchain-neo4j>=0.10.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
