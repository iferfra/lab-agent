services:
  api:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: lab_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Store uploaded papers in the volume so they survive container rebuilds
      - DATA_DIR=/data/
    volumes:
      - lab_data:/data

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: lab_frontend
    depends_on:
      - api
    ports:
      - "10000:10000"
    environment:
      - API_UPSTREAM=http://api:8000

volumes:
  lab_data:
